<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Comparación reproducible de tres modelos CAMPIS en TensorFlow Lite.">
  <title>CAMPIS · Comparación TFLite</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root{--ink:#15352d;--muted:#61716c;--paper:#f4f1e8;--card:#fffdf7;--line:#d8d8cc;--green:#176b52;--lime:#b9df64;--amber:#f2a93b;--coral:#db6749;--blue:#5b79b7;--shadow:0 18px 50px rgba(34,54,46,.09)}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,system-ui,sans-serif;line-height:1.5}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.34;background-image:radial-gradient(#789085 0.65px,transparent .65px);background-size:16px 16px;mask-image:linear-gradient(to bottom,#000,transparent 60%)}
    .shell{width:min(1180px,calc(100% - 32px));margin:auto;position:relative}.nav{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand{font-weight:800;letter-spacing:-.04em;font-size:22px}.brand i{display:inline-block;width:12px;height:12px;background:var(--lime);border:3px solid var(--ink);border-radius:50%;margin-right:9px}.nav small,.eyebrow,.mono{font-family:"DM Mono",monospace}.nav small{color:var(--muted)}
    .hero{padding:80px 0 42px;display:grid;grid-template-columns:1.35fr .65fr;gap:48px;align-items:end}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--green);font-weight:500}.hero h1{font-size:clamp(48px,7vw,92px);line-height:.94;letter-spacing:-.065em;margin:16px 0 26px;max-width:850px}.hero h1 span{color:var(--green)}
    .lede{font-size:19px;max-width:710px;color:#435b54}.proof{background:var(--ink);color:#f7f5eb;padding:28px;border-radius:24px;box-shadow:var(--shadow);transform:rotate(1deg)}.proof strong{display:block;font-size:42px;letter-spacing:-.05em}.proof p{color:#bdcbc5;margin-bottom:0}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 5px rgba(185,223,100,.14);margin-right:8px}
    .section{padding:54px 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:24px}.section h2{font-size:clamp(30px,4vw,48px);letter-spacing:-.045em;line-height:1;margin:8px 0}.section-head p{max-width:520px;color:var(--muted);margin:0}
    .verdict{background:var(--green);color:white;border-radius:28px;padding:34px 38px;display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;box-shadow:var(--shadow)}.verdict h3{font-size:28px;letter-spacing:-.03em;margin:0 0 8px}.verdict p{margin:0;color:#d6e7e1;max-width:760px}.winner{background:var(--lime);color:var(--ink);padding:12px 18px;border-radius:100px;font-weight:800;white-space:nowrap}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.model-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;position:relative;overflow:hidden}.model-card:before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:var(--color);margin-bottom:22px}.model-card h3{font-size:24px;letter-spacing:-.03em;margin:0}.model-card .desc{color:var(--muted);min-height:48px}.big{font-size:47px;font-weight:800;letter-spacing:-.06em;line-height:1;margin:28px 0 4px}.big-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.delta{display:inline-block;margin-top:12px;border-radius:7px;padding:4px 7px;background:#ecede6;font:12px "DM Mono"}.delta.up{background:#dcedc8;color:#315f23}.delta.down{background:#f5ddd4;color:#8b3425}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid var(--line);margin-top:24px;padding-top:18px}.mini-grid b{display:block;font-size:18px}.mini-grid span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px}.toolbar{display:flex;gap:8px}.toolbar button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 13px;border-radius:100px;font:600 13px Manrope;cursor:pointer}.toolbar button.active{background:var(--ink);color:white;border-color:var(--ink)}
    .bars{display:grid;gap:26px;margin-top:26px}.bar-group h4{margin:0 0 10px;font-size:14px}.bar-line{display:grid;grid-template-columns:160px 1fr 72px;gap:12px;align-items:center;margin:9px 0;font-size:13px}.track{height:13px;background:#e5e5db;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:var(--color);border-radius:inherit;transition:width .7s cubic-bezier(.2,.8,.2,1)}.bar-value{text-align:right;font:500 13px "DM Mono"}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:22px;background:var(--card)}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:17px 18px;border-bottom:1px solid var(--line)}th{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);background:#efeee6}tbody tr:last-child td{border-bottom:0}td.num{font-family:"DM Mono";text-align:right}.tag{display:inline-flex;align-items:center;padding:5px 8px;background:#e8eee9;border-radius:7px;font-size:12px}.caution{background:#f6e4c7;color:#835615}.flip-detail{margin-top:14px}.flip-detail h3{font-size:15px;margin:0 0 8px}.flip-detail p{color:var(--muted);font-size:12px;margin:0 0 10px}
    .class-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.class-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}.class-card h4{font:500 13px "DM Mono";margin:0 0 18px}.score-row{display:flex;align-items:center;justify-content:space-between;margin:12px 0;font-size:13px}.score-row b{font-family:"DM Mono"}.score-mark{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--color);margin-right:8px}
    .method{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.method article{border-top:1px solid var(--ink);padding-top:18px}.method b{font-size:26px;display:block;letter-spacing:-.04em}.method p{color:var(--muted);font-size:14px}.hash{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12px "DM Mono";color:var(--muted)}
    footer{margin-top:50px;padding:36px 0 48px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.loading{padding:100px 0;text-align:center}.error{color:#8b3425;background:#f5ddd4;padding:18px;border-radius:12px}
    @media(max-width:850px){.hero{grid-template-columns:1fr;padding-top:52px}.proof{transform:none}.cards,.class-grid,.method{grid-template-columns:1fr}.verdict{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column}.bar-line{grid-template-columns:110px 1fr 62px}.nav small{display:none}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.fill{transition:none}}
  </style>
</head>
<body>
  <div class="shell">
    <nav class="nav"><div class="brand"><i></i>CAMPIS</div><small>TFLite / Mobile benchmark</small></nav>
    <main id="app"><div class="loading"><span class="dot"></span>Cargando resultados medidos…</div></main>
    <footer><span>Experimento reproducible · semilla 42</span><span class="mono">TensorFlow Lite</span></footer>
  </div>
  <script>
    const colors=['#176b52','#db6749','#5b79b7','#f2a93b'];
    const pct=(v,d=2)=>(v*100).toFixed(d).replace('.',',')+' %';
    const dec=(v,d=2)=>Number(v).toFixed(d).replace('.',',');
    const mb=b=>dec(b/1048576,2)+' MB';
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function scope(run,key){return key==='global'?run.tflite.global:run.tflite.by_source[key]}
    function bestRun(runs,key,metric='accuracy'){return [...runs].sort((a,b)=>scope(b,key)[metric]-scope(a,key)[metric])[0]}
    function render(data){
      const runs=data.runs, base=runs[0], winner=bestRun(runs,'global');
      const delta=(v,b)=>{const d=(v-b)*100, cls=d>0?'up':d<0?'down':'';return `<span class="delta ${cls}">${d>=0?'+':''}${dec(d,2)} pts vs. anterior</span>`};
      document.querySelector('#app').innerHTML=`
        <section class="hero"><div><div class="eyebrow">Decisión basada en el artefacto desplegable</div><h1>${runs.length===2?'Dos':'Tres'} modelos.<br><span>Una misma prueba.</span></h1><p class="lede">Resultados reales de las versiones <strong>.tflite</strong> sobre ${data.methodology.test_samples.toLocaleString('es-PE')} hojas reservadas. La comparación separa cámara profesional y celular para que el promedio global no esconda la brecha entre dominios.</p></div><aside class="proof"><div class="eyebrow" style="color:#b9df64"><span class="dot"></span>Protocolo verificado</div><strong>${data.methodology.test_samples.toLocaleString('es-PE')}</strong><p>imágenes idénticas en cada test, comprobadas por firma SHA-256.</p></aside></section>
        <section class="section"><div class="verdict"><div><div class="eyebrow" style="color:#b9df64">Lectura principal</div><h3>${esc(winner.label)} lidera el test TFLite global</h3><p>Obtiene ${pct(winner.tflite.global.accuracy)} de accuracy y ${dec(winner.tflite.global.macro_f1,3)} de macro F1. Revisa CAMPIS e Irish por separado antes de elegir: la mezcla del test está dominada por fotos Irish.</p></div><div class="winner">Mejor global · ${pct(winner.tflite.global.accuracy)}</div></div></section>
        <section class="section" id="models"><div class="section-head"><div><div class="eyebrow">Resultado desplegable</div><h2>Métricas TFLite</h2></div><p>Accuracy global como lectura rápida; Macro F1 y resultados por cámara para comprobar que las tres clases y ambos dominios se sostienen.</p></div><div class="cards">${runs.map((r,i)=>`<article class="model-card" style="--color:${colors[i]}"><h3>${esc(r.label)}</h3><p class="desc">${esc(r.description)}<br><span class="mono">${r.train_samples.toLocaleString('es-PE')} train</span></p><div class="big">${pct(r.tflite.global.accuracy)}</div><div class="big-label">Accuracy global · TFLite</div>${delta(r.tflite.global.accuracy,base.tflite.global.accuracy)}<div class="mini-grid"><div><b>${dec(r.tflite.global.macro_f1,3)}</b><span>Macro F1</span></div><div><b>${mb(r.mobile.model_bytes)}</b><span>Peso</span></div><div><b>${pct(r.tflite.by_source.campis.accuracy)}</b><span>CAMPIS</span></div><div><b>${pct(r.tflite.by_source.irish.accuracy)}</b><span>Irish</span></div></div></article>`).join('')}</div></section>
        <section class="section"><div class="section-head"><div><div class="eyebrow">Sin promedios engañosos</div><h2>Rendimiento por dominio</h2></div><div class="toolbar"><button class="active" data-metric="accuracy">Accuracy</button><button data-metric="macro_f1">Macro F1</button></div></div><div class="panel"><div class="bars" id="bars"></div></div></section>
        <section class="section"><div class="section-head"><div><div class="eyebrow">Listo para integrar</div><h2>Huella y fidelidad móvil</h2></div><p>El tamaño y las predicciones sí pertenecen al archivo TFLite. El tiempo es una referencia de CPU host a 1 hilo y debe confirmarse en el teléfono objetivo.</p></div><div class="table-wrap"><table><thead><tr><th>Modelo</th><th>Archivo</th><th>Entrada / salida</th><th>CPU host*</th><th>Acuerdo Keras ↔ TFLite</th><th>Cambios de clase</th></tr></thead><tbody>${runs.map((r,i)=>`<tr><td><span class="score-mark" style="--color:${colors[i]}"></span><strong>${esc(r.label)}</strong></td><td class="num">${mb(r.mobile.model_bytes)}</td><td><span class="tag">${r.mobile.input_dtype} → ${r.mobile.output_dtype}</span></td><td class="num">${dec(r.mobile.mean_ms_host,2)} ms/img</td><td class="num">${pct(r.mobile.class_agreement_rate)}</td><td class="num"><span class="tag ${r.mobile.class_flips?'caution':''}">${r.mobile.class_flips} / ${r.test_samples.toLocaleString('es-PE')}</span></td></tr>`).join('')}</tbody></table></div><p style="color:var(--muted);font-size:12px">* Incluye invocación TFLite y transferencia de tensores; excluye lectura/recorte de la imagen. No equivale a un benchmark Android/iOS.</p></section>
        <section class="section"><div class="section-head"><div><div class="eyebrow">Dónde acierta y falla</div><h2>F1 por clase · TFLite</h2></div><div class="toolbar" id="scope"><button class="active" data-scope="global">Global</button><button data-scope="campis">CAMPIS</button><button data-scope="irish">Irish</button></div></div><div class="class-grid" id="classes"></div></section>
        <section class="section"><div class="section-head"><div><div class="eyebrow">Control experimental</div><h2>Qué se mantuvo fijo</h2></div></div><div class="method"><article><b>Mismo test</b><p>${data.methodology.test_samples.toLocaleString('es-PE')} imágenes, mismas rutas y mismo orden en las tres corridas.</p></article><article><b>10 + 10</b><p>Épocas máximas de cabeza y fine-tuning, MobileNetV3Small a 224 × 224, misma semilla y aumentos.</p></article><article><b>Solo train cambia</b><p>Validación y test permanecen intactos. No se copiaron ni alteraron imágenes originales.</p></article></div><p class="hash" title="${data.methodology.test_signature_sha256}">Firma del test · ${data.methodology.test_signature_sha256}</p></section>`;
      const drawBars=metric=>{document.querySelector('#bars').innerHTML=['global','campis','irish'].map(k=>`<div class="bar-group"><h4>${k==='global'?'Todas las imágenes':k==='campis'?'CAMPIS · cámara profesional':'Irish · celular'}</h4>${runs.map((r,i)=>{const v=scope(r,k)[metric];return `<div class="bar-line"><span>${esc(r.label)}</span><div class="track"><div class="fill" style="--color:${colors[i]};width:${v*100}%"></div></div><span class="bar-value">${metric==='accuracy'?pct(v):dec(v,3)}</span></div>`}).join('')}</div>`).join('')};
      const drawClasses=k=>{const names=['early_blight','healthy','late_blight'];document.querySelector('#classes').innerHTML=names.map(name=>`<article class="class-card"><h4>${name}</h4>${runs.map((r,i)=>`<div class="score-row"><span><i class="score-mark" style="--color:${colors[i]}"></i>${esc(r.label)}</span><b>${dec(scope(r,k).classification_report[name]['f1-score'],3)}</b></div>`).join('')}</article>`).join('')};
      drawBars('accuracy');drawClasses('global');
      const flipCell=(r,source)=>{const d=r.mobile.class_flips_by_source?.[source]||{class_flips:0,samples:0,class_flip_rate:0};return `${d.class_flips} / ${d.samples.toLocaleString('es-PE')} · ${pct(d.class_flip_rate)}`};
      document.querySelector('.table-wrap').insertAdjacentHTML('afterend',`<section class="flip-detail"><h3>Origen de los cambios de clase</h3><p>Cambios entre la predicción Keras y la predicción TFLite. El porcentaje se calcula dentro de cada grupo del dataset.</p><div class="table-wrap"><table><thead><tr><th>Modelo</th><th>CAMPIS · cambios / total / %</th><th>Irish · cambios / total / %</th></tr></thead><tbody>${runs.map((r,i)=>`<tr><td><span class="score-mark" style="--color:${colors[i]}"></span><strong>${esc(r.label)}</strong></td><td class="num">${flipCell(r,'campis')}</td><td class="num">${flipCell(r,'irish')}</td></tr>`).join('')}</tbody></table></div></section>`);
      document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-metric]').forEach(x=>x.classList.toggle('active',x===b));drawBars(b.dataset.metric)});
      document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-scope]').forEach(x=>x.classList.toggle('active',x===b));drawClasses(b.dataset.scope)});
    }
    fetch(`data.json?updated=${Date.now()}`).then(r=>{if(!r.ok)throw Error('No se encontró data.json');return r.json()}).then(render).catch(e=>document.querySelector('#app').innerHTML=`<div class="loading error">${esc(e.message)}. Sirve esta carpeta con un servidor HTTP local.</div>`);
  </script>
</body>
</html>
