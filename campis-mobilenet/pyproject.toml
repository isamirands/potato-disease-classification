[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campis-mobilenet"
version = "1.0.0"
description = "Clasificador multicefalico de enfermedades foliares CAMPIS"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "torchvision>=0.20", "PyYAML>=6.0", "Pillow>=10.0", "numpy>=1.26"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
