# Experimento comparativo 1.
# El manifest conserva el mismo val/test del modelo de referencia y elimina
# Irish solamente de train. Esto permite medir transferencia a fotos móviles.

[paths]
project_root = ".."
artifacts_dir = "artifacts"
manifest_path = "artifacts/manifests/modelo1_solo_campis.csv"

[data]
classes = ["early_blight", "healthy", "late_blight"]
extensions = [".jpg", ".jpeg", ".png", ".bmp"]
seed = 42
verify_images = true
balance_strategy = "source_class"
samples_per_source_class = 2000
hash_duplicates = true
group_campis_by_minutes = 0
group_sequence_gap = 0
max_images_per_source_class = 0

[data.ratios]
train = 0.70
val = 0.15
test = 0.15

[[data.sources]]
name = "campis"
path = "datasets/dataset_campis"
camera_type = "professional"

[[data.sources]]
name = "irish"
path = "datasets/dataset_irish"
camera_type = "cellphone"

[model]
image_size = [224, 224]
dense_units = [256, 128]
dropout = 0.30
weights = "imagenet"
fine_tune_fraction = 0.30
tflite_optimize = true
crop_to_square = true

[training]
batch_size = 32
head_epochs = 10
fine_tune_epochs = 10
head_lr = 0.001
fine_tune_lr = 0.00001
patience = 5
num_workers = 4

[augmentation]
flip = true
rotation = 0.04
translation = 0.10
zoom = 0.10
contrast = 0.20
