[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campis-vision"
version = "1.0.0"
description = "Pipeline reproducible para clasificar enfermedades de papa en dominios CAMPIS e Irish."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "tensorflow>=2.21,<2.22",
  "numpy>=2.5,<2.6",
  "Pillow>=12.3,<13",
  "scikit-learn>=1.9,<2",
  "matplotlib>=3.11,<4",
]

[project.scripts]
campis = "campis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

